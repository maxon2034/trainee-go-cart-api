apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: test
spec:
  serviceName: "db-headless"
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: db
          env:
            # Имя базы данных из ConfigMap
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: test-config
                  key: POSTGRES_DB

            # Пользователь базы данных из ConfigMap
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: test-config
                  key: POSTGRES_USER

            # Пароль базы данных из Secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-secret
                  key: DB_PASSWORD

            # Подпапка для данных PostgreSQL (для избежания конфликта с lost+found на PVC)
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: hard
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: hard
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi