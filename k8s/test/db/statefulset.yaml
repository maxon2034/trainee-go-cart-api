apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: test
spec:
  serviceName: "db-headless"
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: db
          volumeMounts:
            - name: hard
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: hard
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi