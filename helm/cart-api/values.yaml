nameOverride: ""
fullnameOverride: ""

namespace:
  create: false

image:
  repository: trainee-go-cart-api-app
  tag: latest
  pullPolicy: Never

imagePullSecrets: []

replicaCount: 1

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

ingressClass:
  create: false
  name: ""
  controller: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: cart-api.local
  path: /
  pathType: Prefix
  tls: []

resources:
  requests:
    memory: 64Mi
    cpu: 20m
  limits:
    memory: 256Mi
    cpu: 100m

probes:
  enabled: true
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300

config:
  APP_PORT: "8080"
  DB_NAME: cart_db
  DB_PORT: "5432"
  DB_USER: cart_user

secret:
  create: true
  existingSecret: ""
  dbPassword: changeme

db:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    staticPv:
      enabled: false
      hostPath: /data/cart-api
