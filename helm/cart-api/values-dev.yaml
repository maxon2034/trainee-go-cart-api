image:
  repository: trainee-go-cart-api-app
  tag: latest
  pullPolicy: Never

replicaCount: 1

service:
  nodePort: 30080

ingress:
  host: cart-api.dev.local

resources:
  requests:
    memory: 64Mi
    cpu: 20m
  limits:
    memory: 256Mi
    cpu: 100m

autoscaling:
  minReplicas: 1
  maxReplicas: 3

db:
  image:
    repository: postgres
    tag: 16-alpine
  persistence:
    size: 1Gi
