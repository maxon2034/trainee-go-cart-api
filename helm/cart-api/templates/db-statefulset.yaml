{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cart-api.dbName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cart-api.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cart-api.dbHeadless" . | quote }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cart-api.dbSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cart-api.dbSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.config.DB_PORT }}
              name: db
          envFrom:
            - configMapRef:
                name: {{ include "cart-api.configName" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cart-api.secretName" . }}
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          volumeMounts:
            - name: hard
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: hard
      spec:
        accessModes:
          {{- toYaml .Values.db.persistence.accessModes | nindent 10 }}
        {{- $sc := include "cart-api.dbStorageClass" . }}
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}
{{- end }}
