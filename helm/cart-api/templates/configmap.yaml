apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cart-api.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cart-api.labels" . | nindent 4 }}
data:
  APP_PORT: {{ .Values.config.APP_PORT | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  DB_PORT: {{ .Values.config.DB_PORT | quote }}
  DB_USER: {{ .Values.config.DB_USER | quote }}
  POSTGRES_DB: {{ .Values.config.DB_NAME | quote }}
  POSTGRES_USER: {{ .Values.config.DB_USER | quote }}
