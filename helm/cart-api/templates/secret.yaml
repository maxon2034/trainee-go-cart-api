{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cart-api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cart-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secret.dbPassword is required" .Values.secret.dbPassword | quote }}
{{- end }}
