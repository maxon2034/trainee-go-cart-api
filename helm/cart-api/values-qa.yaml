image:
  repository: trainee-go-cart-api-app
  tag: latest
  pullPolicy: Never

replicaCount: 2

service:
  nodePort: 30081

ingress:
  host: cart-api.qa.local

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m

autoscaling:
  minReplicas: 2
  maxReplicas: 5

db:
  image:
    repository: postgres
    tag: 16-alpine
  persistence:
    size: 2Gi
