image:
  repository: trainee-go-cart-api-app
  tag: latest
  pullPolicy: Never

replicaCount: 3

service:
  nodePort: 30082

ingress:
  host: cart-api.prod.local

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

autoscaling:
  minReplicas: 3
  maxReplicas: 10

db:
  image:
    repository: postgres
    tag: 16-alpine
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
  persistence:
    size: 5Gi
